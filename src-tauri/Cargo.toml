[package]
name = "token-tach"
version = "0.0.1"
description = "AI coding tool spend monitor"
authors = ["YOLOVibeCode"]
edition = "2021"

[lib]
name = "token_tach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2"
async-trait = "0.1"

# tauri-plugin-updater + tauri-plugin-process: removed for v0.0.x.
# Re-add when generating a Tauri signing keypair — see RELEASING.md §3.

[dev-dependencies]
mockall = "0.13"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
